<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Water Reminder - Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      user-select: none;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      pointer-events: none;
    }

    .anime-character-container {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%) translateX(100%);
      height: 300px;
      width: auto;
      z-index: 5;
      pointer-events: none;
      animation: slideIn 1s ease-out forwards;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .anime-character-container.exit {
      animation: slideOut 1s ease-in forwards;
    }

    .anime-character-container img {
      height: 260px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(-15px 15px 20px rgba(0, 0, 0, 0.4));
      pointer-events: none;
    }

    /* Button Container below the character/gif */
    .button-container {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      pointer-events: auto; /* Ensures you can click the buttons */
      z-index: 10;
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.2s, background 0.2s;
    }

    .action-btn:hover {
      transform: scale(1.05);
    }

    .close-action-btn {
      background: rgba(100, 100, 100, 0.85);
    }
    .close-action-btn:hover {
      background: rgba(150, 150, 150, 0.95);
    }

    .done-action-btn {
      background: rgba(0, 150, 255, 0.9);
    }
    .done-action-btn:hover {
      background: rgba(0, 120, 220, 1);
    }

    @keyframes slideIn {
      0% { transform: translateY(-50%) translateX(100%); }
      100% { transform: translateY(-50%) translateX(0); }
    }

    @keyframes slideOut {
      0% { transform: translateY(-50%) translateX(0); }
      100% { transform: translateY(-50%) translateX(100%); }
    }
  </style>
</head>
<body>

  <div class="anime-character-container" id="character">
    <img id="reminderGif" src="kashish1.gif" alt="Water Reminder">
    <div class="button-container">
      <button class="action-btn close-action-btn" id="closeBtn">Close</button>
      <button class="action-btn done-action-btn" id="doneBtn">Drank</button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.invoke('get-settings').then((settings) => {
      if (settings && settings.gifPath) {
        document.getElementById('reminderGif').src = settings.gifPath;
      }
    }).catch((err) => {
      console.error('Failed to load settings in view:', err);
    });

    const character = document.getElementById('character');

    function triggerExit(actionType) {
      if (character.classList.contains('exit')) return;
      character.classList.add('exit');
      
      // Tell main process which button was clicked (snooze 5 mins or reset 20 mins)
      ipcRenderer.send('reminder-action', actionType);

      setTimeout(() => {
        window.close();
      }, 1000); 
    }

    // Close clicked -> Snooze for 5 minutes
    document.getElementById('closeBtn').addEventListener('click', () => {
      triggerExit('snooze');
    });

    // Done clicked -> Reset timer for 20 minutes
    document.getElementById('doneBtn').addEventListener('click', () => {
      triggerExit('done');
    });

    // Auto-close safety fallback after 2 minutes (120,000 ms) if ignored (defaults to snooze action)
    setTimeout(() => {
      triggerExit('snooze');
    }, 120000);
  </script>

</body>
</html>
